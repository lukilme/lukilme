<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tree Link</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700;900&family=Space+Mono:wght@400;700&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="src/main.css" />
  <script src="src/main.js" defer></script>
</head>

<body>

  <canvas id="bg"></canvas>

  <div class="page" role="main">

    <!-- Top bar -->
    <div class="topbar">
      <div class="toggle-group" role="group" aria-label="Idioma">
        <button id="btn-pt" class="active" onclick="setLang('pt')" aria-pressed="true">PT</button>
        <button id="btn-en" onclick="setLang('en')" aria-pressed="false">EN</button>
      </div>
      <div class="toggle-group" role="group" aria-label="Modo de cor">
        <button id="btn-light" class="active" onclick="setMode('light')" aria-pressed="true">☀</button>
        <button id="btn-dark" onclick="setMode('dark')" aria-pressed="false">☾</button>
      </div>
    </div>

    <!-- Avatar + name -->
    <img class="avatar" aria-hidden="true" src="assets/perfil.png">
    <p class="handle">Luis Kilmer (@lukilme)</p>
    <p class="bio" id="bio">...</p>

    <!-- Main links -->
    <nav class="links" aria-label="Links principais">
      <a href="https://lukilme.github.io/portfolio-website/" target="_blank" rel="noopener" class="link-btn l-portfolio">

        <span class="link-label" id="lbl-portfolio">Portfólio</span>
        <span class="link-arrow" aria-hidden="true">→</span>
      </a>

      <a href="https://substack.com/@luiskilmer" target="_blank" rel="noopener" class="link-btn l-substack">
        <img class="link-icon" aria-hidden="true" src="./assets/icons/substack_icon.svg">
        <span class="link-label" id="lbl-substack">Newsletter</span>
        <span class="link-arrow" aria-hidden="true">→</span>
      </a>
      <a href="https://github.com/lukilme" target="_blank" rel="noopener" class="link-btn l-github"
        aria-label="GitHub">

          </svg>
        </div>
        <span class="link-label">GitHub</span>
        <span class="link-arrow" aria-hidden="true">→</span>
      </a>

      <a href="https://gitlab.com/lukilme" target="_blank" rel="noopener" class="link-btn l-gitlab"
        aria-label="GitLab">
        <div class="link-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
            <path
              d="M22.65 14.39L12 22.13 1.35 14.39a.84.84 0 01-.3-.94l1.22-3.78 2.44-7.51A.42.42 0 014.82 2a.43.43 0 01.58 0 .42.42 0 01.11.18l2.44 7.49h8.1l2.44-7.51A.42.42 0 0118.6 2a.43.43 0 01.58 0 .42.42 0 01.11.18l2.44 7.51L23 13.45a.84.84 0 01-.35.94z" />
          </svg>
        </div>
        <span class="link-label">GitLab</span>
        <span class="link-arrow" aria-hidden="true">→</span>
      </a>
    </nav>

    <!-- Divider -->
    <div class="divider" aria-hidden="true"><span id="divider-label">REDES</span></div>

    <!-- Social icons -->
    <div class="socials" role="list" aria-label="Redes sociais">

      <a href="https://instagram.com/luiskillmer" target="_blank" rel="noopener noreferrer" class="social-btn s-ig"
        role="listitem" aria-label="Instagram" title="Instagram">
        <svg class="social-icon" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor"
          stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="2" y="2" width="20" height="20" rx="5" ry="5"></rect>
          <path d="M16 11.37A4 4 0 1112.63 8 4 4 0 0116 11.37z"></path>
          <line x1="17.5" y1="6.5" x2="17.51" y2="6.5"></line>
        </svg>
      </a>

      <a href="https://linkedin.com/in/luis-kilmer" target="_blank" rel="noopener noreferrer" class="social-btn s-li"
        role="listitem" aria-label="LinkedIn" title="LinkedIn">
        <svg class="social-icon" viewBox="0 0 24 24" aria-hidden="true" fill="currentColor">
          <path d="M16 8a6 6 0 016 6v7h-4v-7a2 2 0 00-2-2 2 2 0 00-2 2v7h-4v-7a6 6 0 016-6z"></path>
          <path d="M2 9h4v12H2z"></path>
          <circle cx="4" cy="4" r="2"></circle>
        </svg>
      </a>

      <a href="https://youtube.com/@lukilme" target="_blank" rel="noopener noreferrer" class="social-btn s-yt"
        role="listitem" aria-label="YouTube" title="YouTube">
        <svg class="social-icon" viewBox="0 0 24 24" aria-hidden="true" fill="currentColor">
          <path
            d="M23 12c0 2.2-.2 4.3-.5 5.2-.3.9-1 1.6-1.9 1.9C19.7 19.4 12 19.4 12 19.4s-7.7 0-8.6-.3c-.9-.3-1.6-1-1.9-1.9C1.2 16.3 1 14.2 1 12s.2-4.3.5-5.2c.3-.9 1-1.6 1.9-1.9C4.3 4.6 12 4.6 12 4.6s7.7 0 8.6.3c.9.3 1.6 1 1.9 1.9.3.9.5 3 .5 5.2z">
          </path>
          <polygon class="yt-play" points="10,9 16,12 10,15"></polygon>
        </svg>
      </a>

    </div>
    <p>

    </p>
    <footer id="footer">
      <p>...</p>
    </footer>
  </div>


</body>

</html>
